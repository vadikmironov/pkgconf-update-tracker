name: Drift

# Each day: is this repository still the same as BCR, and does a version wait
# for its pull request? See tools/common/drift.py.

on:
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  drift:
    name: Drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get the module directory of BCR main
        run: |
          module="$(python3 -c 'import json; print(json.load(open("upstream.json"))["module"])')"
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/bazelbuild/bazel-central-registry "$RUNNER_TEMP/bcr"
          git -C "$RUNNER_TEMP/bcr" sparse-checkout set "modules/$module"
      - name: Compare, and look after the publish issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/common/drift.py "$RUNNER_TEMP/bcr"
