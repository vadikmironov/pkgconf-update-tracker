name: CI

# The gate. One job renders the module, and each other job tests those same
# bytes. A version bump must pass here before it goes to BCR.

on:
  pull_request:
  push:
    # dev/** lets a person try a change of the CI with no pull request.
    branches: [main, "dev/**"]
  schedule:
    # Each Monday. Dependencies change when the module does not.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version to render; default: upstream.json"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      module: ${{ steps.render.outputs.module }}
      module_version: ${{ steps.render.outputs.module_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render the module
        id: render
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tools/common/render.py ${VERSION:+--version "$VERSION"}
          module="$(python3 -c 'import json; print(json.load(open("upstream.json"))["module"])')"
          echo "module=$module" >> "$GITHUB_OUTPUT"
          echo "module_version=$(ls "rendered/registry/modules/$module" | grep -v -e metadata.json -e README.md)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered
          path: rendered/
          # An overlay can contain a dotfile, for example .bazelignore.
          include-hidden-files: true
          if-no-files-found: error

  test:
    name: ${{ matrix.platform.name }}, Bazel ${{ matrix.bazel }}
    needs: render
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        bazel: ["7.x", "8.x", "9.x"]
        platform:
          - { name: "Ubuntu 24.04 x64", runner: ubuntu-24.04 }
          - { name: "Ubuntu 24.04 arm64", runner: ubuntu-24.04-arm }
          - { name: "macOS arm64", runner: macos-latest }
          - { name: "macOS x64", runner: macos-15-intel }
          - { name: "Windows x64", runner: windows-2022 }
          - { name: "Windows arm64", runner: windows-11-arm }
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rendered
          path: rendered
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
      - name: Build and test through the rendered registry
        shell: bash
        working-directory: rendered/consumers/default
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            # A short output base keeps the paths under the Windows limit.
            startup="--output_base=C:/b"
            registry="file:///$(cd ../../registry && pwd -W)"
          else
            startup=""
            registry="file://$(cd ../../registry && pwd)"
          fi
          bazel $startup version
          bazel $startup test --verbose_failures --test_output=errors \
            --registry="$registry" --registry=https://bcr.bazel.build \
            "@${{ needs.render.outputs.module }}//..."

  test-ubuntu2004:
    # The oldest image of the BCR presubmit. GitHub has no such runner, so the
    # job runs in a container.
    name: Ubuntu 20.04 ${{ matrix.arch.name }}, Bazel ${{ matrix.bazel }}
    needs: render
    runs-on: ${{ matrix.arch.runner }}
    container: ubuntu:20.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        bazel: ["7.x", "8.x", "9.x"]
        arch:
          - { name: "x64", runner: ubuntu-24.04, bazelisk: amd64 }
          - { name: "arm64", runner: ubuntu-24.04-arm, bazelisk: arm64 }
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Install a toolchain and bazelisk
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git python3 unzip zip
          curl -fsSL -o /usr/local/bin/bazel \
            "https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-${{ matrix.arch.bazelisk }}"
          chmod +x /usr/local/bin/bazel
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rendered
          path: rendered
      - name: Build and test through the rendered registry
        shell: bash
        working-directory: rendered/consumers/default
        run: |
          registry="file://$(cd ../../registry && pwd)"
          bazel version
          bazel test --verbose_failures --test_output=errors \
            --registry="$registry" --registry=https://bcr.bazel.build \
            "@${{ needs.render.outputs.module }}//..."

  module-checks:
    # Checks that are specific to this module. See tools/module/.
    name: pkgconf checks
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rendered
          path: rendered
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
      - name: The generated config.h has no entry without a check
        working-directory: rendered/consumers/default
        run: |
          registry="file://$(cd ../../registry && pwd)"
          flags=(--registry="$registry" --registry=https://bcr.bazel.build)
          bazel build "${flags[@]}" @pkgconf//:config_h
          config_h="$(bazel cquery "${flags[@]}" --output=files @pkgconf//:config_h 2>/dev/null)"
          "$GITHUB_WORKSPACE/tools/module/check_undef_set.sh" "$config_h"
      - name: Tests with a runfiles manifest, the mode that Windows always uses
        working-directory: rendered/consumers/default
        run: |
          registry="file://$(cd ../../registry && pwd)"
          bazel test --noenable_runfiles --test_output=errors \
            --registry="$registry" --registry=https://bcr.bazel.build @pkgconf//...

  gate:
    # The one required check. It fails if a job before it did not pass.
    name: Gate
    if: always()
    needs: [render, test, test-ubuntu2004, module-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          python3 -c 'import json, os, sys; sys.exit(0 if set(json.loads(os.environ["RESULTS"])) == {"success"} else 1)'

  rendered-branch:
    # A literal copy of the module, as BCR holds it, with links that operate.
    # It is a mirror only: a push with the built-in token starts no workflow.
    name: Update the rendered branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [render, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rendered
          path: ${{ runner.temp }}/rendered
      - name: Commit the render
        env:
          VERSION: ${{ needs.render.outputs.module }}@${{ needs.render.outputs.module_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin rendered >/dev/null; then
            git checkout rendered
          else
            git checkout --orphan rendered
          fi
          # -f: on a new orphan branch, git sees each file as staged.
          git rm -rqf --ignore-unmatch .
          git clean -fdxq
          cp -R "$RUNNER_TEMP/rendered/registry/modules" modules
          git add -A
          if git diff --cached --quiet; then
            echo "The render did not change."
          else
            git commit -q -m "$VERSION, rendered from ${GITHUB_SHA::7}"
            git push origin rendered
          fi
